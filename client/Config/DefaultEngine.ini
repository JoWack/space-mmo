; Project engine settings.
;
; The maps section below is load-bearing: without a default map the editor initialises fully and
; then crashes on a null assertion the moment it tries to execute anything, which looks nothing
; like a missing-configuration problem. Both point at the engine's own empty Entry map for now —
; it loads in milliseconds, which keeps headless automation runs fast, and it means the project
; has no content dependency until we author our own maps.

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry
ServerDefaultMap=/Engine/Maps/Entry.Entry
TransitionMap=/Engine/Maps/Entry.Entry

; So pressing Play produces a flyable ship rather than an empty camera.
GlobalDefaultGameMode=/Script/SpaceMMOCore.SpaceMMOGameMode

[/Script/Engine.Engine]
; Two clients on one machine is how this project is tested, and by default an unfocused game
; pauses -- so the window you just switched away from stops responding entirely.
;
; Off for the same reason a dedicated server does not pause: the simulation is authoritative and
; elsewhere. A client that pauses itself is only lying to the person looking at it.
;
; Kept on its own merits, not as a fix. It was first set while chasing "only one client accepts
; input", and it did not solve that -- the cause was AutoPossessPlayer on the ship pawn, which is
; written up in SpaceMMOShipPawn.cpp.
bPauseOnLossOfFocus=False

