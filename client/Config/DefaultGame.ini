[/Script/SpaceMMOCore.SpaceMMOCharacterPawn]
; The character model and how it sits on the pawn. Config rather than compiled, for the reason the
; terrain material is: deciding how something looks means trying a value and looking at it, and a
; rebuild in the middle of that loop is how people stop iterating. Unset leaves the placeholder
; tube, which is a working state and says so in the log.
;
; The pawn's origin is the character's feet, so a model whose own origin is at its feet needs no
; offset. The yaw is Unreal's mannequin convention -- a mesh authored facing forward wants 0.
CharacterMesh=/Game/Characters/Human/HumanCharacterRigged.HumanCharacterRigged
CharacterMeshRotation=(Pitch=0.0,Yaw=-90.0,Roll=0.0)
CharacterMeshOffset=(X=0.0,Y=0.0,Z=0.0)
CharacterAnimClass=/Game/Characters/Human/ABP_Human.ABP_Human_C

; The drawn body turns to face the way the character is travelling; the pawn still faces the mouse
; and still strafes. Presentation only -- the walk model is simulated by the dedicated server and
; has no opinion about which way a mesh is pointing. Chosen because the animation library's lateral
; clips are angled runs rather than strafes, so a character who faces where they are going needs
; none of them: one forward jog covers every direction. Set the first to False to strafe instead.
;
; The turn rate is a feel value. 720 is brisk; 360 reads as a more deliberate pivot.
bCharacterFacesTravel=True
CharacterTurnRateDegreesPerSecond=720.0
CharacterFacingSpeedThresholdMetresPerSecond=0.2

[/Script/SpaceMMOCore.SpaceMMOPlanetActor]
TerrainMaterial=/Game/Materials/M_Terrain.M_Terrain

; Which of the five authored worlds the scene is. One key, and it decides three things at once:
; the terrain shape, the palette, and which body's deposits and stations are placed on it. It was
; two keys until 19 August -- this one, and a hard-coded body_capital in the deposit subsystem --
; so the world drew Ares and populated it from the Capital, with nothing looking wrong from
; either side. The Capital, because the onboarding chain lives there: scrap to gather, ferrite to
; mine once the laser is crafted. Ares has one level-15 ore and nothing to start on.
BodyKey=body_capital