bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=True
bEnableFOVScaling=True
; False so a newly launched client does not seize the mouse the instant it appears -- with this on,
; starting a second client takes the cursor away from the first. Click into a window to give it the
; mouse.
;
; A convenience for testing two windows on one desktop, not a fix. It was first set while chasing
; "only the window opened last responds", which turned out to be AutoPossessPlayer on the ship pawn.
bCaptureMouseOnLaunch=False
bEnableLegacyInputScales=True
bEnableMotionControls=True
bFilterInputByPlatformUser=False
bShouldFlushPressedKeysOnViewportFocusLost=True
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=True
bEnableGestureRecognizer=False
bUseAutocorrect=False
bEnabledLegacyMappingDeprecationWarnings=True
bEnablePreferredInputAPIPreferences=False
DefaultPreferredInputAPIList=
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
; DoNotLock, not LockOnCapture. Locking confines the cursor to the window that captured it, so
; there is no way to click on the other client -- the pointer physically cannot reach it. Mouse
; look still works while captured; the cursor is simply free to leave.
;
; This is a windowed-development trade. A shipping fullscreen build wants the cursor locked, and
; that is worth revisiting when there is a settings screen to expose it from.
DefaultViewportMouseLockMode=DoNotLock
FOVScale=0.011110
DoubleClickTime=0.200000
DeprecatedActionAndAxisNames=()
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultTouchInterface=/Engine/MobileResources/HUD/DefaultVirtualJoysticks.DefaultVirtualJoysticks
-ConsoleKeys=Tilde
+ConsoleKeys=Tilde

; ── Ship flight ──────────────────────────────────────────────────────────────
; Legacy axis and action mappings rather than Enhanced Input, which needs binary
; InputAction and InputMappingContext assets that cannot be authored as text. The legacy
; path is still present and unmarked in UE 5.8. Worth migrating once someone opens the
; editor to create the assets.
;
; Names here must match the BindAxis/BindAction calls in SpaceMMOShipPawn.cpp.

+AxisMappings=(AxisName="ShipThrustForward",Key=W,Scale=1.000000)
+AxisMappings=(AxisName="ShipThrustForward",Key=S,Scale=-1.000000)
+AxisMappings=(AxisName="ShipThrustRight",Key=D,Scale=1.000000)
+AxisMappings=(AxisName="ShipThrustRight",Key=A,Scale=-1.000000)
+AxisMappings=(AxisName="ShipThrustUp",Key=SpaceBar,Scale=1.000000)
+AxisMappings=(AxisName="ShipThrustUp",Key=LeftControl,Scale=-1.000000)
; Inverted: pushing the mouse forward pitches the nose down, like a flight stick rather than like
; a first-person camera. Flip this scale back to -1 to swap it.
+AxisMappings=(AxisName="ShipPitch",Key=MouseY,Scale=1.000000)
+AxisMappings=(AxisName="ShipYaw",Key=MouseX,Scale=1.000000)
+AxisMappings=(AxisName="ShipRoll",Key=Q,Scale=-1.000000)
+AxisMappings=(AxisName="ShipRoll",Key=E,Scale=1.000000)
+ActionMappings=(ActionName="ShipBoost",Key=LeftShift)
+AxisMappings=(AxisName="WalkForward",Key=W,Scale=1.000000)
+AxisMappings=(AxisName="WalkForward",Key=S,Scale=-1.000000)
+AxisMappings=(AxisName="WalkRight",Key=D,Scale=1.000000)
+AxisMappings=(AxisName="WalkRight",Key=A,Scale=-1.000000)
+AxisMappings=(AxisName="WalkTurn",Key=MouseX,Scale=1.000000)
+ActionMappings=(ActionName="WalkJump",Key=SpaceBar)
+ActionMappings=(ActionName="Board",Key=F)
+ActionMappings=(ActionName="ToggleCamera",Key=C)
+ActionMappings=(ActionName="Gather",Key=E)
; Bound on the player controller rather than a pawn, so it works in the ship and on foot alike --
; the panel is about who you are, and that does not change when you climb out.
+ActionMappings=(ActionName="ToggleCharacterPanel",Key=Tab)
