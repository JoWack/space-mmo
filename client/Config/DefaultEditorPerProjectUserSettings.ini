; Editor-only, per-user settings that we want to be the project default.
;
; The MCP server is startup-only: there is no console command to start or stop it, and
; ShouldAutoStartServer is read once during module startup. The alternative is the
; -ModelContextProtocolStartServer command line flag, which this machine cannot be trusted to
; pass through intact -- see the LogInit: Command Line: note in CLAUDE.md. So it goes in a file.
;
; Changing this takes effect on the next editor launch, not on the running one.

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp
