[/Script/Engine.RendererSettings]
; Auto-exposure measures scene brightness and adapts. In space the scene is almost entirely black,
; so it opens fully and every lit surface saturates to white — which is half of why the planet
; looked like a black and white ball. Fixed exposure means a lit surface reads the same whether
; it is alone in the void or sitting above a bright horizon.
r.DefaultFeature.AutoExposure=False


[/Script/UdpMessaging.UdpMessagingSettings]
; The automation runner talks to itself over a message bus, and that bus works in-process. This
; turns off its UDP transport, which nothing here needs and which started failing on 31 August:
; ten `SendTo failed (destination: 230.0.0.1:6666) (SE_EINVAL)` in one run, after months of none.
;
; It matters because an Error-level log during a test fails that test, whatever wrote it. Two
; consecutive runs failed two entirely different tests -- SpaceMMO.Patch.AssemblesLikeTheGlobe and
; then SpaceMMO.Planet.SurfaceGravityMatchesConfig -- because the multicast error landed on whichever
; one happened to be in flight. A red suite that names a different innocent test each time is worse
; than a red suite, because the first thing anybody does is go and read that test.
;
; Off rather than silenced: this is a transport nothing in the project uses, and suppressing its log
; would leave it failing quietly instead. Session Frontend and multi-user editing want it back on.
;
; EnableTransport is the switch. EnabledByDefault was tried first and does nothing on its own -- it
; governs whether the transport is enabled when nobody has said, and the plugin was already starting
; it. One run passed after that change and the next failed, which is exactly what a setting that did
; not take looks like from outside.
EnableTransport=False
EnabledByDefault=False
