; Which of the five authored worlds the scene is. One key, and it decides three things at once:
; the terrain shape, the palette, and which body's deposits and stations are placed on it. It was
; two keys until 19 August -- this one, and a hard-coded body_capital in the deposit subsystem --
; so the world drew Ares and populated it from the Capital, with nothing looking wrong from
; either side. The Capital, because the onboarding chain lives there: scrap to gather, ferrite to
; mine once the laser is crafted. Ares has one level-15 ore and nothing to start on.
BodyKey=body_capital