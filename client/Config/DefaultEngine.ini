; Project engine settings.
;
; The maps section below is load-bearing: without a default map the editor initialises fully and
; then crashes on a null assertion the moment it tries to execute anything, which looks nothing
; like a missing-configuration problem. Both point at the engine's own empty Entry map for now —
; it loads in milliseconds, which keeps headless automation runs fast, and it means the project
; has no content dependency until we author our own maps.

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry
ServerDefaultMap=/Engine/Maps/Entry.Entry
TransitionMap=/Engine/Maps/Entry.Entry

; So pressing Play produces a flyable ship rather than an empty camera.
GlobalDefaultGameMode=/Script/SpaceMMOCore.SpaceMMOGameMode

[/Script/Engine.Engine]
; Two clients on one machine is how this project is tested, and by default an unfocused game
; pauses -- so the window you just switched away from stops responding entirely, and switching
; back does not obviously revive it. That reads as "only one client accepts input".
;
; Off for the same reason a dedicated server does not pause: the simulation is authoritative and
; elsewhere. A client that pauses itself is only lying to the person looking at it.
bPauseOnLossOfFocus=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

; Written by the Android File Server plugin on first editor launch. Kept so the editor does not
; rewrite this file on every start.
[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=0976B3BF4F2B68CBCA905E872D4F490A
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

[/Script/Engine.RendererSettings]
; Auto-exposure measures scene brightness and adapts. In space the scene is almost entirely black,
; so it opens fully and every lit surface saturates to white — which is half of why the planet
; looked like a black and white ball. Fixed exposure means a lit surface reads the same whether
; it is alone in the void or sitting above a bright horizon.
r.DefaultFeature.AutoExposure=False
