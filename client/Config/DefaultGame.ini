[/Script/SpaceMMOBackend.SpaceMMOStationSettings]
; What each kind of station looks like and how large it stands. Engine primitives for now: they are
; placeholders, but five distinguishable silhouettes beat one cube five times, and swapping in an
; authored building later is one line each rather than a recompile.
;
; Sizes are judged against the horizon. On a 20 km planet that is about 260 m from eye height, so a
; 60 m building subtends thirteen degrees and reads as the size of the visible world. 25 m is a
; landmark you can see from most of the way there; 8 m is a house.
MeshesByKind=(("Capital", "/Engine/BasicShapes/Cone.Cone"),("Spaceport", "/Engine/BasicShapes/Cylinder.Cylinder"),("TradingHub", "/Engine/BasicShapes/Cube.Cube"),("Social", "/Engine/BasicShapes/Sphere.Sphere"),("Housing", "/Engine/BasicShapes/Cube.Cube"))
SizeMetresByKind=(("Capital", 40.0),("Spaceport", 35.0),("TradingHub", 25.0),("Social", 12.0),("Housing", 8.0))
DefaultSizeMetres=25.0
; When a kind gets a real building, name its Blueprint here and it wins over the mesh above. The
; path must end in _C -- that is the generated class rather than the asset, and without it the load
; fails and the station quietly keeps its cube. A Blueprint is drawn at the size it was authored,
; so SizeMetresByKind stops applying to that kind.
; Trying the kit's own example on the capital hub, which now stands about 500 m from where a
; character spawns -- close enough to walk up to and judge. By key rather than by kind, so only that
; one station changes and the other four keep their placeholders.
BlueprintsByKey=(("station_capital_hub", "/Game/ZenUV_SciFi_TrimSheet/Prefabs/BP_Building_Example.BP_Building_Example_C"))

